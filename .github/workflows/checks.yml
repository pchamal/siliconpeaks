name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: npm test
      - name: Verify generated pages are current
        run: git diff --exit-code -- index.html companies startups investors sitemap.xml llms-full.txt lms.txt
